name: Release

on:
  push:
    branches: [ master, '*.x' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    if: github.ref_name == 'master' || endsWith(github.ref_name, '.x')
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
      sha: ${{ steps.release.outputs['src/redmine-net-api--sha'] || steps.release.outputs['src/redmine-net-api.Http--sha'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

      - id: packages
        name: Released packages
        env:
          CORE_RELEASED: ${{ steps.release.outputs['src/redmine-net-api--release_created'] }}
          HTTP_RELEASED: ${{ steps.release.outputs['src/redmine-net-api.Http--release_created'] }}
        run: |
          packages=()
          if [[ "$CORE_RELEASED" == true ]]; then packages+=(redmine-api); fi
          if [[ "$HTTP_RELEASED" == true ]]; then packages+=(redmine-api.http); fi
          echo "packages=${packages[*]}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.packages != ''
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      packages: ${{ needs.release-please.outputs.packages }}
      ref: ${{ needs.release-please.outputs.sha }}
    secrets: inherit
