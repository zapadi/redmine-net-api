name: Release

on:
  push:
    branches: [ '[0-9]+.x' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      core-released: ${{ steps.release.outputs['src/redmine-net-api--release_created'] }}
      core-sha: ${{ steps.release.outputs['src/redmine-net-api--sha'] }}
      http-released: ${{ steps.release.outputs['src/redmine-net-api.Http--release_created'] }}
      http-sha: ${{ steps.release.outputs['src/redmine-net-api.Http--sha'] }}
    steps:
      - name: Check branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^[0-9]+\.x$ ]]; then
            echo "::error::Packages are released only from N.x branches (e.g. 4.x), not from '$BRANCH'."
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}

  publish-core:
    name: Publish redmine-api
    needs: release-please
    if: needs.release-please.outputs.core-released == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      packages: redmine-api
      ref: ${{ needs.release-please.outputs.core-sha }}
    secrets: inherit

  publish-http:
    name: Publish redmine-api.http
    needs: release-please
    if: needs.release-please.outputs.http-released == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/publish.yml
    with:
      packages: redmine-api.http
      ref: ${{ needs.release-please.outputs.http-sha }}
    secrets: inherit
