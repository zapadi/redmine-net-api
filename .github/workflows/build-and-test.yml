name: Build and Test

on:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build and test (defaults to the triggering commit)'
        required: false
        type: string
  workflow_dispatch:
  push:
    branches: [ master, '*.x' ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.slnx'
      - '**.props'
      - '**.targets'
      - 'global.json'
      - '**/CompatibilitySuppressions.xml'
      - 'tests/redmine-net-api.Integration.Tests/**'
      - '.github/workflows/build-and-test.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ master, '*.x' ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.slnx'
      - '**.props'
      - '**.targets'
      - 'global.json'
      - '**/CompatibilitySuppressions.xml'
      - 'tests/redmine-net-api.Integration.Tests/**'
      - '.github/workflows/build-and-test.yml'
      - '.github/scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Build and Test' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore redmine-net-api.slnx

      - name: Build
        run: dotnet build redmine-net-api.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test
          --project tests/redmine-net-api.Tests/redmine-net-api.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --output detailed
          --report-trx
          --hangdump
          --hangdump-timeout 5m
          --hangdump-type Mini
          --results-directory TestResults

      - name: Test (.NET Framework)
        if: matrix.os == 'windows-latest'
        run: >-
          dotnet test
          --project tests/redmine-net-api.Tests/redmine-net-api.Tests.csproj
          --configuration Release
          --framework net481
          --no-restore
          --output detailed
          --report-trx
          --hangdump
          --hangdump-timeout 5m
          --hangdump-type Mini
          --results-directory TestResults

      - name: Validate package
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for package in redmine-api redmine-api.http; do
            case "$package" in
              redmine-api) project=src/redmine-net-api/redmine-net-api.csproj ;;
              redmine-api.http) project=src/redmine-net-api.Http/redmine-net-api.Http.csproj ;;
            esac

            version=$(dotnet msbuild "$project" -getProperty:Version)
            for sign in false true; do
              id=$package
              if [[ "$sign" == true ]]; then id=$package-signed; fi
              baseline=$(.github/scripts/nuget-baseline.sh "$id" "$version")
              echo "Packing $id $version (package validation baseline: ${baseline:-none})"
              dotnet pack "$project" \
                --configuration Release \
                --output ./artifacts \
                -p:Sign="$sign" \
                ${baseline:+-p:PackageValidationBaselineVersion="$baseline"}
            done
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          overwrite: true
          path: TestResults

  integration:
    name: Integration ${{ matrix.client }} ${{ matrix.serializer }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        client: [ Http, Web ]
        serializer: [ Xml, Json ]
    env:
      TestContainer__Redmine__Client: ${{ matrix.client }}
      TestContainer__Redmine__Serializer: ${{ matrix.serializer }}
      TestContainer__Redmine__Authentication__ApiKey: 61d6fa45ca2c570372b08b8c54b921e5fc39335a

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore tests/redmine-net-api.Integration.Tests/redmine-net-api.Integration.Tests.csproj

      - name: Build
        run: >-
          dotnet build tests/redmine-net-api.Integration.Tests/redmine-net-api.Integration.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore

      - name: Test
        run: >-
          dotnet test
          --project tests/redmine-net-api.Integration.Tests/redmine-net-api.Integration.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-build
          --output detailed
          --report-trx
          --hangdump
          --hangdump-timeout 10m
          --hangdump-type Mini
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-results-${{ matrix.client }}-${{ matrix.serializer }}
          overwrite: true
          path: TestResults
