name: Build and Test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.slnx'
      - '**.props'
      - '**.targets'
      - 'global.json'
      - '**/CompatibilitySuppressions.xml'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [ master ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.slnx'
      - '**.props'
      - '**.targets'
      - 'global.json'
      - '**/CompatibilitySuppressions.xml'
      - '.github/workflows/build-and-test.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - name: Restore
        run: dotnet restore redmine-net-api.slnx

      - name: Build
        run: dotnet build redmine-net-api.slnx --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test
          --project tests/redmine-net-api.Tests/redmine-net-api.Tests.csproj
          --configuration Release
          --framework net10.0
          --no-restore
          --output detailed
          --report-trx
          --hangdump
          --hangdump-timeout 5m
          --results-directory TestResults

      - name: Test (.NET Framework)
        if: matrix.os == 'windows-latest'
        run: >-
          dotnet test
          --project tests/redmine-net-api.Tests/redmine-net-api.Tests.csproj
          --configuration Release
          --framework net481
          --no-restore
          --output detailed
          --report-trx
          --hangdump
          --hangdump-timeout 5m
          --results-directory TestResults

      - name: Validate package
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/redmine-net-api/redmine-net-api.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/redmine-net-api.Http/redmine-net-api.Http.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/redmine-net-api/redmine-net-api.csproj --configuration Release --output ./artifacts -p:Sign=true
          dotnet pack src/redmine-net-api.Http/redmine-net-api.Http.csproj --configuration Release --output ./artifacts -p:Sign=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
