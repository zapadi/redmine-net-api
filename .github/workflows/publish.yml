name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (SemVer, e.g. 4.51.0)'
        required: true
        type: string
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid SemVer version (X.Y.Z[-prerelease])."
            exit 1
          fi
          master_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha)
          if [[ "$GITHUB_SHA" != "$master_sha" ]]; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not the master HEAD ($master_sha)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Build and Test
    needs: version
    uses: ./.github/workflows/build-and-test.yml

  pack:
    name: Pack
    needs: [ version, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - name: Pack
        run: >-
          dotnet pack src/redmine-net-api/redmine-net-api.csproj
          --configuration Release
          --output ./artifacts
          --include-symbols
          -p:SymbolPackageFormat=snupkg
          -p:Version="$VERSION"
          -p:PackageVersion="$VERSION"

      - name: Pack signed
        run: >-
          dotnet pack src/redmine-net-api/redmine-net-api.csproj
          --configuration Release
          --output ./artifacts
          --include-symbols
          -p:SymbolPackageFormat=snupkg
          -p:Version="$VERSION"
          -p:PackageVersion="$VERSION"
          -p:Sign=true

      - uses: actions/attest@v4
        with:
          subject-path: ./artifacts/*.nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ./artifacts

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts

      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
