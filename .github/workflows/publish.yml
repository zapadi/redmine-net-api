name: Publish to NuGet

on:
  workflow_call:
    inputs:
      packages:
        description: 'Space-separated package ids to publish (redmine-api, redmine-api.http)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      packages:
        description: 'Package to publish (the version is the <Version> in its csproj)'
        required: true
        type: choice
        options:
          - redmine-api
          - redmine-api.http

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Build and Test
    uses: ./.github/workflows/build-and-test.yml

  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Packages are published from master only ($GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6

      - name: Pack
        shell: bash
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          for package in $PACKAGES; do
            case "$package" in
              redmine-api) project=src/redmine-net-api/redmine-net-api.csproj ;;
              redmine-api.http) project=src/redmine-net-api.Http/redmine-net-api.Http.csproj ;;
              *) echo "::error::Unknown package '$package'."; exit 1 ;;
            esac

            version=$(dotnet msbuild "$project" -getProperty:Version)
            published=$(.github/scripts/nuget-versions.sh "$package")
            if grep -qx "$version" <<< "$published"; then
              echo "::error::$package $version is already on nuget.org. Bump <Version> in $project."
              exit 1
            fi

            for sign in false true; do
              id=$package
              if [[ "$sign" == true ]]; then id=$package-signed; fi
              baseline=$(.github/scripts/nuget-versions.sh "$id" | awk '!/-/ { v = $0 } END { print v }')
              echo "Packing $id $version (package validation baseline: ${baseline:-none})"
              dotnet pack "$project" \
                --configuration Release \
                --output ./artifacts \
                -p:Sign="$sign" \
                ${baseline:+-p:PackageValidationBaselineVersion="$baseline"}
            done
          done

      - uses: actions/attest@v4
        with:
          subject-path: ./artifacts/*.nupkg

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ./artifacts

  publish:
    name: Publish
    needs: [ test, pack ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    concurrency:
      group: publish-nuget
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts

      - id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
